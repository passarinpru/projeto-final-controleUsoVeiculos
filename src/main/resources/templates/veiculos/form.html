<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de veículo')}"></head>
<body>

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <h1 class="h4 mb-3">Cadastro de veículo</h1>

    <form th:action="@{/veiculos/salvar}"
          th:object="${veiculo}"
          method="post"
          class="card p-4 shadow-sm">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="modelo" class="form-label">Modelo</label>
            <input type="text"
                   id="modelo"
                   th:field="*{modelo}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('modelo')}"
                 th:errors="*{modelo}"></div>
        </div>

        <div class="mb-3">
            <label for="placa" class="form-label">Placa</label>
            <input type="text"
                   id="placa"
                   th:field="*{placa}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('placa')}"
                 th:errors="*{placa}"></div>
        </div>

        <div class="mb-3">
            <label for="quilometragem" class="form-label">
                Quilometragem
            </label>
            <input type="number"
                   id="quilometragem"
                   th:field="*{quilometragem}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('quilometragem')}"
                 th:errors="*{quilometragem}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-app">Salvar</button>
            <a th:href="@{/veiculos}"
               class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

</body>
</html>
