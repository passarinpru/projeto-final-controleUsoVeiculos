<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de funcionário')}"></head>
<body>

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <h1 class="h4 mb-3">Cadastro de funcionário</h1>

    <form th:action="@{/funcionarios/salvar}"
          th:object="${funcionario}"
          method="post"
          class="card p-4 shadow-sm">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text"
                   id="nome"
                   th:field="*{nome}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('nome')}"
                 th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label for="matricula" class="form-label">Matrícula</label>
            <input type="text"
                   id="matricula"
                   th:field="*{matricula}"
                   class="form-control"
                   th:errorclass="is-invalid">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('matricula')}"
                 th:errors="*{matricula}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-app">Salvar</button>
            <a th:href="@{/funcionarios}"
               class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

</body>
</html>
