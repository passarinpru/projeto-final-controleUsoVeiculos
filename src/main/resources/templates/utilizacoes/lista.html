
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Histórico de Utilizações</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
<div class="container mt-4">

    <h1>Histórico de Utilização dos Veículos</h1>

    <p>Consulte os veículos utilizados pelos funcionários.</p>

    <div th:if="${mensagem}"
         class="alert alert-success"
         th:text="${mensagem}">
    </div>

    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>

    <a th:href="@{/utilizacoes/novo}"
       class="btn btn-primary mb-3">
        Registrar nova saída
    </a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Funcionário</th>
                <th>Veículo</th>
                <th>Saída</th>
                <th>Retorno</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="uso : ${utilizacoes}">
                <td th:text="${uso.funcionario.nome}"></td>

                <td th:text="${uso.veiculo.modelo}"></td>

                <td th:text="${#temporals.format(
                    uso.dataHoraSaida, 'dd/MM/yyyy HH:mm')}">
                </td>

                <td th:text="${uso.dataHoraRetorno != null ?
                    #temporals.format(
                    uso.dataHoraRetorno, 'dd/MM/yyyy HH:mm')
                    : '-'}">
                </td>

                <td th:text="${uso.dataHoraRetorno == null ?
                    'Em utilização' : 'Devolvido'}">
                </td>

                <td>
                    <form th:if="${uso.dataHoraRetorno == null}"
                          th:action="@{/utilizacoes/{id}/devolver(id=${uso.id})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-success btn-sm">
                            Devolver
                        </button>
                    </form>

                    <span th:if="${uso.dataHoraRetorno != null}"
                          class="text-muted">
                        Finalizado
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(utilizacoes)}">
                <td colspan="6" class="text-center">
                    Nenhuma utilização registrada.
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/" class="btn btn-secondary">
        Voltar ao início
    </a>

</div>
</body>
</html>
