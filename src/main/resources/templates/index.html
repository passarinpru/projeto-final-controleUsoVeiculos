
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Painel de Indicadores')}"></head>

<body>

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-speedometer2 me-2"></i>
            Painel de Indicadores
        </h2>
        <p class="text-muted">
            Acompanhe a utilização dos veículos da empresa.
        </p>
    </div>

    <div class="row g-4">

        <!-- Total de veículos -->
        <div class="col-md-6 col-xl-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-primary mb-2">
                        <i class="bi bi-truck fs-2"></i>
                    </div>
                    <h6 class="text-muted">
                        Veículos cadastrados
                    </h6>
                    <h2 class="fw-bold"
                        th:text="${totalVeiculos}">0</h2>
                </div>
            </div>
        </div>

        <!-- Veículos em utilização -->
        <div class="col-md-6 col-xl-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-warning mb-2">
                        <i class="bi bi-car-front-fill fs-2"></i>
                    </div>
                    <h6 class="text-muted">
                        Em utilização
                    </h6>
                    <h2 class="fw-bold"
                        th:text="${emUtilizacao}">0</h2>
                </div>
            </div>
        </div>

        <!-- Veículos disponíveis -->
        <div class="col-md-6 col-xl-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-success mb-2">
                        <i class="bi bi-check-circle-fill fs-2"></i>
                    </div>
                    <h6 class="text-muted">
                        Veículos disponíveis
                    </h6>
                    <h2 class="fw-bold"
                        th:text="${disponiveis}">0</h2>
                </div>
            </div>
        </div>

        <!-- Total de utilizações -->
        <div class="col-md-6 col-xl-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-info mb-2">
                        <i class="bi bi-clock-history fs-2"></i>
                    </div>
                    <h6 class="text-muted">
                        Total de utilizações
                    </h6>
                    <h2 class="fw-bold"
                        th:text="${totalUtilizacoes}">0</h2>
                </div>
            </div>
        </div>

    </div>

    <!-- Acesso rápido -->
    <div class="card shadow-sm mt-4">
        <div class="card-header bg-white fw-semibold">
            <i class="bi bi-lightning-charge me-1"></i>
            Acesso rápido
        </div>

        <div class="card-body d-flex flex-wrap gap-2">

            <a th:href="@{/veiculos}"
               class="btn btn-outline-primary">
                <i class="bi bi-truck me-1"></i>
                Ver veículos
            </a>

            <a th:href="@{/utilizacoes}"
               class="btn btn-outline-success">
                <i class="bi bi-clock-history me-1"></i>
                Ver utilizações
            </a>

            <a th:href="@{/funcionarios}"
               class="btn btn-outline-secondary">
                <i class="bi bi-people me-1"></i>
                Ver funcionários
            </a>

            <a th:href="@{/diagnostico}"
               class="btn btn-outline-secondary">
                <i class="bi bi-clipboard2-pulse me-1"></i>
                Diagnóstico
            </a>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

</body>
</html>
