
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo} + ' | ' + ${appNome}">
        Página | Sistema
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body>

<!-- MENU PRINCIPAL -->
<nav th:fragment="menu"
     class="navbar navbar-expand-lg navbar-dark bg-app">

    <div class="container">

        <!-- Logo da empresa e nome do sistema -->
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2"
           th:href="@{/}">

            <img th:src="@{/img/logo.png}"
                 src="/img/logo.png"
                 alt="Logo Turbinas União"
                 style="width: 85px;
                        height: 48px;
                        object-fit: cover;
                        border-radius: 5px;">

            <span th:text="${appNome}">
                Controle de Veículos
            </span>

        </a>

        <!-- Menu para dispositivos móveis -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="menuPrincipal">

            <!-- LINKS DO SISTEMA -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/}">
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/funcionarios}">
                        Funcionários
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/veiculos}">
                        Veículos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/utilizacoes}">
                        Utilizações
                    </a>
                </li>

            </ul>

            <!-- INFORMAÇÕES DO USUÁRIO LOGADO -->
            <div class="d-flex align-items-center gap-3"
                 sec:authorize="isAuthenticated()">

                <!-- Nome do usuário -->
                <span class="text-white-50 small">

                    <i class="bi bi-person-circle"></i>

                    <span sec:authentication="name">
                        usuário
                    </span>

                </span>

                <!-- Perfil ADMINISTRADOR -->
                <span class="badge text-bg-light"
                      sec:authorize="hasRole('ADMIN')">

                    <i class="bi bi-shield-check"></i>
                    Administrador

                </span>

                <!-- Perfil OPERADOR -->
                <span class="badge text-bg-light"
                      sec:authorize="hasRole('OPERADOR')">

                    <i class="bi bi-person-gear"></i>
                    Operador

                </span>

                <!-- Botão SAIR -->
                <form th:action="@{/logout}"
                      method="post"
                      class="m-0">

                    <button class="btn btn-sm btn-outline-light"
                            type="submit">

                        <i class="bi bi-box-arrow-right"></i>
                        Sair

                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<!-- RODAPÉ -->
<footer th:fragment="rodape"
        class="border-top mt-5 py-3 text-muted small">

    <div class="container d-flex justify-content-between flex-wrap gap-2">

        <span>
            Turbinas União · Controle de Veículos
        </span>

        <span>
            Projeto Final · Técnico em Desenvolvimento de Sistemas · SENAI
        </span>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</footer>

</body>
</html>
