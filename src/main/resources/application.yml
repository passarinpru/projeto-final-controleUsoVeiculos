
# =====================================================================
# CONFIGURAÇÕES DO SISTEMA - CONTROLE DE VEÍCULOS
# SENAI - Encontro 09 - Estabilização do Sistema
# =====================================================================

app:
  # Nome do sistema
  nome: "Controle de Veículos"

  # Segurança ativada
  seguranca:
    ativa: true

server:
  port: 8080

  # Corrige os redirecionamentos no GitHub Codespaces
  forward-headers-strategy: framework

spring:
  application:
    name: sistema

  # Banco de dados H2
  datasource:
    url: "jdbc:h2:file:./dados/banco;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
    username: sa
    password: ""

  # Configurações do JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true

  # Console do banco de dados
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # Configurações do Thymeleaf
  thymeleaf:
    cache: false
